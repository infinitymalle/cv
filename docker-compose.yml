# Production-like setup: `docker compose up --build`
# Only the "web" container (Caddy) is reachable from outside; the API lives on an internal network.

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Content__RootPath: /app/content
      # Trust X-Forwarded-For only from Caddy's network, so rate limiting sees real client IPs.
      Security__TrustedProxyNetworks__0: 172.28.0.0/24
    volumes:
      - ./content:/app/content:ro   # edit content without rebuilding; read-only for the container
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # HTTPS certificates
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # needed to listen on ports 80/443
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
